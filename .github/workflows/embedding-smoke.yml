name: Embedding ABI smoke

on:
  pull_request:
    paths:
      - 'src/ffi/**'
      - 'src/vm.rs'
      - 'include/nulang.h'
      - 'examples/ffi_example.c'
      - 'scripts/check-embedding.sh'
      - '.github/workflows/embedding-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embedding-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  embed:
    name: Rust SDK and C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2

      - name: Focused embedding tests and C example
        run: bash scripts/check-embedding.sh
